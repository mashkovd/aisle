version: 2

project_name: aisle

before:
  hooks:
    - go mod tidy
    # completions ship in the archive: the cask must not execute the
    # still-quarantined binary during install (Gatekeeper blocks it)
    - rm -rf completions
    - mkdir completions
    - sh -c 'for sh in bash zsh fish; do go run ./cmd/aisle completion $sh > completions/aisle.$sh; done'

builds:
  - main: ./cmd/aisle
    binary: aisle
    env:
      - CGO_ENABLED=0 # modernc.org/sqlite is pure Go
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }} -X main.date={{ .Date }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md, completions/*]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

homebrew_casks:
  - name: aisle
    repository:
      owner: mashkovd
      name: homebrew-tap
      # an SSH deploy key with write access to the tap only; unlike a token it does not expire
      git:
        url: git@github.com:mashkovd/homebrew-tap.git
        private_key: '{{ envOrDefault "HOMEBREW_TAP_DEPLOY_KEY" "" }}'
    directory: Casks
    homepage: https://github.com/mashkovd/aisle
    description: Cross-agent session navigator for Claude Code, Codex, Gemini CLI and Antigravity
    license: MIT
    dependencies:
      - formula: tmux
    completions:
      bash: completions/aisle.bash
      zsh: completions/aisle.zsh
      fish: completions/aisle.fish
    # binaries are not notarized yet
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/aisle"]
          end
    commit_msg_template: "aisle {{ .Tag }}"
